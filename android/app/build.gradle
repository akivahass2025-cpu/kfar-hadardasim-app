plugins {
    id 'com.android.application'
}

def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'io.github.jonathan2505joe.kfar'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.jonathan2505joe.kfar'
        minSdk 24
        targetSdk 34
        versionCode run
        versionName "1.${run}"
    }

    // One fixed key, so every new build installs over the previous one and keeps the saved progress.
    signingConfigs {
        shared {
            storeFile file('../kfar.keystore')
            storePassword 'kfar-hadardasim'
            keyAlias 'kfar'
            keyPassword 'kfar-hadardasim'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
